services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    # SQLite path is fixed by the Dockerfile (DATABASE_URL=/data/pyweb.db).
    # Bind-mount ./data on the host so the file is editable / inspectable
    # with normal host tools (sqlite3, DBeaver, scp, ...). The container's
    # pyweb user runs as uid 1000 — match your host user uid so writes
    # round-trip without chown.
    volumes:
      - ./data:/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      # Repo root so the Dockerfile can COPY both frontend/ and nginx/.
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - backend
    restart: unless-stopped
