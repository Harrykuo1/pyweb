# Cap every container's json-file log so it can't grow unbounded and fill
# the host disk. Anchored here and reused by each service via `logging:`.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-init:
    build:
      context: ./backend
    user: "0:0"
    command: ["python", "-m", "app.postgres_credentials"]
    volumes:
      - ./data:/data
    network_mode: none
    logging: *default-logging
    restart: "no"

  postgres:
    image: postgres:17
    user: "1000:1000"
    environment:
      POSTGRES_USER: pyweb
      POSTGRES_DB: pyweb
      POSTGRES_PASSWORD_FILE: /run/secrets/.postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./data:/run/secrets:ro
    # No published database port: only services on the Compose network connect.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyweb -d pyweb"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db-init:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /data/.postgres-password
      LEGACY_SQLITE_PATH: /data/pyweb.db
      # Where the backend reaches OnlyOffice's conversion API. Hostname
      # is the compose-network DNS name of the onlyoffice service.
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      # Reverse direction: where OnlyOffice fetches source files from when
      # backend asks it to convert. OnlyOffice GETs
      # /internal/source/<job_id>/<filename>, which the backend serves
      # straight off disk with NO token or session — access is gated only by
      # network isolation: nginx proxies /api/* to the backend, /internal/*
      # is unreachable from the host, and backend's 8000 is expose-only
      # (compose-internal). (An earlier per-request token was dropped because
      # OnlyOffice's async queue lagged past its TTL — see
      # app/routers/internal.py.)
      BACKEND_INTERNAL_URL: http://backend:8000
    # The legacy SQLite file, import snapshots and uploads stay in place.
    volumes:
      - ./data:/data
    expose:
      - "8000"
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else sys.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      onlyoffice:
        condition: service_started
      postgres:
        condition: service_healthy

  # OnlyOffice Document Server — used headlessly by the backend for
  # docx/pptx/doc/ppt -> PDF preview conversion. Image is hefty (~1.4GB)
  # but gives much better Microsoft format fidelity than LibreOffice
  # headless, which mangled fonts and SmartArt layouts even after we
  # piled on every available CJK / Calibri-equivalent font.
  #
  # The expose-only ports keep OnlyOffice off the host network — only
  # the backend service inside the compose network reaches it.
  onlyoffice:
    image: onlyoffice/documentserver:8.2
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
    expose:
      - "80"
    logging: *default-logging
    # OnlyOffice is memory-hungry. Uncomment and tune to your host so a
    # runaway conversion can't OOM the whole box (2g is a sane floor for
    # light use; give it more if conversions are large/frequent).
    # mem_limit: 2g
    restart: unless-stopped

  frontend:
    build:
      # Repo root so the Dockerfile can COPY both frontend/ and nginx/.
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:8080"
    logging: *default-logging
    healthcheck:
      # 127.0.0.1, not localhost: the image resolves localhost to ::1 first and
      # nginx only listens on IPv4, so the probe got ECONNREFUSED against a
      # perfectly healthy container.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Wait until the backend is actually healthy (not just started) before
    # the SPA is served, so nginx doesn't proxy /api/* to a booting backend
    # and hand users a 502 right after a restart.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
