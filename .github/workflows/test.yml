name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same branch when a new commit lands, so a
# rapid push doesn't leave older runs hogging minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: pyweb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pyweb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/pyweb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          # Both files matter: requirements-dev.txt does `-r requirements.txt`,
          # so a change to the latter must invalidate the cache or CI installs
          # a stale resolution.
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint before tests: ruff is seconds, so fail fast on style/lint issues
      # before spending minutes on the suite. Config lives in pyproject.toml.
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # Each test gets its own disposable PostgreSQL schema, including xdist workers.
      #
      # -n auto distributes the suite across the runner's CPUs via pytest-xdist
      # (~3x speedup on the 2-vCPU ubuntu-latest runner). --durations=10 lists
      # the slowest tests in the log so creeping regressions stay visible.
      - name: Run pytest
        run: pytest -n auto --durations=10

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + prettier)
        run: |
          npm run lint
          npm run format:check

      - name: Run vitest
        run: npm run test

      # Production build catches issues vitest misses (e.g. a wrong import
      # path that the test mocks paper over) before they reach docker build.
      - name: Build production bundle
        run: npm run build

  # Required secrets: JENKINS_URL, JENKINS_USER, JENKINS_API_TOKEN.
  # The actual deploy runs in Jenkins (Jenkinsfile at repo root); this job
  # just kicks off pyweb-deploy via Jenkins's remote build API.
  deploy:
    name: trigger Jenkins deploy
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Trigger Jenkins build
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          set -eu
          http_code=$(curl -sS -o /tmp/jenkins.out -w "%{http_code}" \
            -X POST \
            -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            "$JENKINS_URL/job/pyweb-deploy/build")
          echo "HTTP $http_code"
          cat /tmp/jenkins.out 2>/dev/null || true
          [ "$http_code" = "201" ]
