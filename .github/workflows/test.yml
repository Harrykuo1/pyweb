name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same branch when a new commit lands, so a
# rapid push doesn't leave older runs hogging minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # backend/tests/conftest.py sets SESSION_SECRET / SEED_* / DATABASE_URL
      # via os.environ.setdefault, so the CI environment doesn't need to
      # provide them.
      - name: Run pytest
        run: pytest

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

      # Production build catches issues vitest misses (e.g. a wrong import
      # path that the test mocks paper over) before they reach docker build.
      - name: Build production bundle
        run: npm run build

  # Required secrets: SSH_HOST, SSH_USER, SSH_PORT, SSH_PRIVATE_KEY, DEPLOY_PATH.
  deploy:
    name: deploy to server
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Pull and rebuild on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "ssh-keyscan returned no host keys"; exit 1; }
          echo "--- nc tcp probe ---"
          nc -vz -w 10 "$SSH_HOST" "$SSH_PORT" || { echo "tcp probe failed"; exit 1; }
          echo "--- nc tcp probe ok ---"
          ssh -vvv \
            -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o KexAlgorithms=-sntrup761x25519-sha512@openssh.com \
            -o IPQoS=none \
            -o ConnectTimeout=20 \
            -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            DEPLOY_PATH="$DEPLOY_PATH" bash -se <<'REMOTE'
              set -e
              cd "$DEPLOY_PATH"
              git fetch --prune origin
              git pull --ff-only origin main
              docker compose build
              docker compose up -d
              docker compose ps
          REMOTE
