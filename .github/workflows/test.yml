name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same branch when a new commit lands, so a
# rapid push doesn't leave older runs hogging minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # backend/tests/conftest.py sets SESSION_SECRET / SEED_* / DATABASE_URL
      # via os.environ.setdefault, so the CI environment doesn't need to
      # provide them.
      - name: Run pytest
        run: pytest

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

      # Production build catches issues vitest misses (e.g. a wrong import
      # path that the test mocks paper over) before they reach docker build.
      - name: Build production bundle
        run: npm run build

  # Auto-deploy is disabled until the server-side firewall situation is
