name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same branch when a new commit lands, so a
# rapid push doesn't leave older runs hogging minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # backend/tests/conftest.py sets SESSION_SECRET / SEED_* / DATABASE_URL
      # via os.environ.setdefault, so the CI environment doesn't need to
      # provide them.
      - name: Run pytest
        run: pytest

  frontend:
    name: frontend (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm run test

      # Production build catches issues vitest misses (e.g. a wrong import
      # path that the test mocks paper over) before they reach docker build.
      - name: Build production bundle
        run: npm run build

  deploy:
    name: deploy to server
    # Gate behind both test jobs so a red bar can't slip through to prod.
    needs: [backend, frontend]
    # Don't deploy on PR runs or feature-branch pushes — main only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deploys: a second push that lands while one is in flight
    # waits its turn instead of racing it.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Stop on the first non-zero so a failed step doesn't pretend
          # the deploy worked.
          script_stop: true
          # Forward the DEPLOY_PATH env var into the remote shell so
          # `cd "$DEPLOY_PATH"` resolves it; drone-ssh starts a fresh
          # non-interactive bash where Actions env vars don't propagate
          # by themselves.
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git pull --ff-only origin main
            # Build first so a broken Dockerfile / dependency error fails
            # before we touch the running containers. If this step exits
            # non-zero, the next `up -d` never runs and the old service
            # keeps serving traffic.
            docker compose build
            docker compose up -d
            docker compose ps
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
