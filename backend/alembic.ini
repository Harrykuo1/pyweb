[alembic]
script_location = alembic

# So `from app.core.config import settings` resolves when alembic is run
# from the backend/ directory. Without this, env.py can't import the app
# package and migrations fail at config-load time.
prepend_sys_path = .

# Migration filenames are prefixed with their date so a chronological listing
# in the versions/ directory matches actual revision order. Alembic still
# uses the random rev id under the hood; the prefix is just for humans.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally blank — env.py reads DATABASE_URL from
# app.core.config so it stays in sync with the application's settings.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
