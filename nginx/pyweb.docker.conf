# pyweb nginx config for the docker-compose deployment.
#
# Compared to pyweb.conf.template, this variant:
# - is mounted by an Alpine nginx image at /etc/nginx/conf.d/pyweb.conf,
#   so the http {} and events {} blocks come from the image's default
#   /etc/nginx/nginx.conf and are not redeclared here.
# - resolves the backend by the Compose service name "backend" instead
#   of a fixed 127.0.0.1, so DNS works inside the Compose network.
# - hard-codes the static root because the dist/ output is COPYed into
#   the image at build time.

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Upper bound is set to cover the largest configurable per-file
    # attachment limit (200MB in app_configs.max_attachment_mb). The
    # backend's runtime check is what actually enforces the admin's
    # configured value — nginx is just a static safety net so that
    # bumping the admin setting doesn't silently fail at the proxy.
    client_max_body_size 256m;

    # gzip text-y responses. Image / PDF blobs are already compressed and
    # are intentionally absent from gzip_types. text/html is compressed by
    # default and does not need to be listed. Lives at server scope so it
    # only affects this site, not anything else nginx:alpine might serve.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # Vite emits hashed filenames for everything under /assets/ — when
    # the bundle changes, the filename changes too, so the cache key
    # turns over on its own. Tell the browser to cache forever and
    # skip even conditional revalidation; this turns repeat visits
    # into pure disk-cache hits. Using only add_header (not the
    # `expires` directive) so we don't emit two Cache-Control values.
    location ^~ /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # index.html is the SPA entry point and its filename is NOT hashed,
    # so we MUST NOT cache it — otherwise users keep referencing old
    # hashed bundle filenames after a deploy and end up with a white
    # screen until they manually clear cache. The same header also
    # needs to apply when index.html is served via try_files for SPA
    # routes (/, /members, /login, etc.), which is why the rule lives
    # in the catch-all location too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # Same no-cache header as the dedicated /index.html block.
        # nginx's add_header only inherits from a parent block when
        # the child has none of its own, so we duplicate it here so
        # SPA routes (/, /members, /login, ...) that fall through
        # try_files into index.html still tell the browser not to
        # cache the entry document.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
